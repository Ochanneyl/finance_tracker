<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Konfigurasi Khusus iOS / iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Tracker">
    <meta name="theme-color" content="#3d312a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Kustomisasi Scrollbar agar tipis dan estetik ala HP */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c5b9;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#2c2420] flex items-center justify-center min-h-screen">

    <!-- Mockup HP Container (Terkunci tingginya dan overflow-hidden agar luar tidak bisa digulir) -->
    <div class="w-full max-w-md h-[844px] bg-[#fbf9f6] shadow-2xl relative flex flex-col justify-between overflow-hidden border-4 border-[#3d312a] sm:rounded-[40px]">
        
        <!-- Area Konten Utama (Semua halaman Beranda, Statistik, Tabungan, Riwayat akan digulir di sini) -->
        <div class="flex-1 overflow-y-auto pb-28">
            {% block content %}{% endblock %}
        </div>

        <!-- Navigasi Bawah (Fixed menempel di bawah layar HP) -->
        <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 px-6 py-3 flex justify-between items-center z-50 shadow-lg">
            <a href="{{ url_for('index') }}" class="flex flex-col items-center {% if request.endpoint == 'index' %}text-[#3d312a] font-bold{% else %}text-gray-400{% endif %}">
                <i class="fa-solid fa-house text-sm"></i>
                <span class="text-[10px] mt-1">Beranda</span>
            </a>
            <a href="{{ url_for('budget') }}" class="flex flex-col items-center {% if request.endpoint == 'budget' %}text-[#3d312a] font-bold{% else %}text-gray-400{% endif %}">
                <i class="fa-solid fa-chart-pie text-sm"></i>
                <span class="text-[10px] mt-1">Statistik</span>
            </a>
            <!-- Tombol Plus Tengah -->
            <a href="{{ url_for('tambah') }}" class="w-12 h-12 bg-[#3d312a] text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition-transform -mt-5 border-4 border-[#fbf9f6]">
                <i class="fa-solid fa-plus text-sm"></i>
            </a>
            <a href="{{ url_for('tabungan') }}" class="flex flex-col items-center {% if request.endpoint == 'tabungan' %}text-[#3d312a] font-bold{% else %}text-gray-400{% endif %}">
                <i class="fa-solid fa-piggy-bank text-sm"></i>
                <span class="text-[10px] mt-1">Tabungan</span>
            </a>
            <a href="{{ url_for('riwayat') }}" class="flex flex-col items-center {% if request.endpoint == 'riwayat' %}text-[#3d312a] font-bold{% else %}text-gray-400{% endif %}">
                <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                <span class="text-[10px] mt-1">Riwayat</span>
            </a>
        </div>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{{ url_for('service_worker') }}").catch(() => {});
            });
        }
    </script>

</body>
</html>
