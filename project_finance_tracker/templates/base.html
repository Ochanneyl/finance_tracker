<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Konfigurasi Khusus iOS / iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Tracker">
    <meta name="theme-color" content="#3d312a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finance Tracker</title>
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-style: normal !important;
            background-color: #f3ede6;
            color: #3d312a;
            overscroll-behavior: none;
        }
        * {
            font-style: normal;
            -webkit-tap-highlight-color: transparent;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
            font-style: normal !important;
        }
        .scroll-area {
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes pageSmoothIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-transition {
            animation: pageSmoothIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .nav-item {
            transition: transform 0.14s ease, color 0.18s ease, background-color 0.18s ease;
        }
        .nav-item:active {
            transform: scale(0.93);
        }
        /* Kustomisasi Scrollbar agar tipis dan estetik ala HP */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c5b9;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#f3ede6] flex items-center justify-center min-h-screen overflow-hidden">

    <!-- Mockup HP Container -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[844px] bg-[#fbf9f6] shadow-2xl relative flex flex-col justify-between overflow-hidden sm:border-4 sm:border-[#3d312a] sm:rounded-[40px]">
        
        <!-- Area Konten Utama -->
        <div class="flex-1 overflow-y-auto scroll-area pb-32 page-transition">
            {% block content %}{% endblock %}
        </div>

        <!-- Navigasi Bawah (Fixed menempel di bawah layar HP) -->
        <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#ede4da] px-3 pt-2.5 pb-6 flex justify-between items-end z-50 shadow-lg">
            <a href="{{ url_for('index') }}" class="nav-item flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-2xl {% if request.endpoint == 'index' %}text-[#3d312a] bg-[#f6f1eb] font-bold{% else %}text-[#8c7e74] font-semibold{% endif %}">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-xs mt-1 leading-none">Beranda</span>
            </a>
            <a href="{{ url_for('budget') }}" class="nav-item flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-2xl {% if request.endpoint == 'budget' %}text-[#3d312a] bg-[#f6f1eb] font-bold{% else %}text-[#8c7e74] font-semibold{% endif %}">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-xs mt-1 leading-none">Statistik</span>
            </a>
            <!-- Tombol Plus Tengah -->
            <a href="{{ url_for('tambah') }}" class="nav-item shrink-0 mx-1.5 w-14 h-14 bg-[#3d312a] text-white rounded-full flex items-center justify-center shadow-lg hover:bg-[#2c221d] -mt-5 border-4 border-[#fbf9f6]">
                <i class="fa-solid fa-plus text-xl"></i>
            </a>
            <a href="{{ url_for('tabungan') }}" class="nav-item flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-2xl {% if request.endpoint == 'tabungan' %}text-[#3d312a] bg-[#f6f1eb] font-bold{% else %}text-[#8c7e74] font-semibold{% endif %}">
                <i class="fa-solid fa-piggy-bank text-lg"></i>
                <span class="text-xs mt-1 leading-none">Tabungan</span>
            </a>
            <a href="{{ url_for('riwayat') }}" class="nav-item flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-2xl {% if request.endpoint == 'riwayat' %}text-[#3d312a] bg-[#f6f1eb] font-bold{% else %}text-[#8c7e74] font-semibold{% endif %}">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                <span class="text-xs mt-1 leading-none">Riwayat</span>
            </a>
        </div>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{{ url_for('service_worker') }}").catch(() => {});
            });
        }
    </script>

</body>
</html>
