{% extends "base.html" %}
{% block content %}
<div class="p-5">
    <div class="flex items-center justify-between mb-6">
        <div>
            <p class="text-xs text-gray-500">Ubah Catatan</p>
            <h1 class="text-xl font-bold text-[#3d312a]">Edit Transaksi</h1>
        </div>
        <a href="{{ url_for('riwayat') }}" class="text-xs font-semibold text-amber-700 hover:underline">
            &larr; Kembali
        </a>
    </div>

    <form method="POST" class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm space-y-4">
        <div>
            <label class="block text-xs font-bold text-[#3d312a] mb-1.5">Jenis Transaksi</label>
            <select name="jenis" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-[#3d312a] bg-[#fcfaf8]">
                <option value="pengeluaran" {% if t.jenis == 'pengeluaran' %}selected{% endif %}>Pengeluaran</option>
                <option value="pemasukan" {% if t.jenis == 'pemasukan' %}selected{% endif %}>Pemasukan</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-[#3d312a] mb-1.5">Jumlah (Rp)</label>
            <input type="number" name="jumlah" value="{{ t.jumlah }}" required min="1"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-[#3d312a] bg-[#fcfaf8]">
        </div>

        <div>
            <label class="block text-xs font-bold text-[#3d312a] mb-1.5">Kategori</label>
            <input type="text" name="kategori" value="{{ t.kategori }}" required
                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-[#3d312a] bg-[#fcfaf8]">
        </div>

        <div>
            <label class="block text-xs font-bold text-[#3d312a] mb-1.5">Tanggal</label>
            <input type="date" name="tanggal" value="{{ t.tanggal }}" required
                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-[#3d312a] bg-[#fcfaf8]">
        </div>

        <div>
            <label class="block text-xs font-bold text-[#3d312a] mb-1.5">Catatan</label>
            <input type="text" name="catatan" value="{{ t.catatan or '' }}"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-[#3d312a] bg-[#fcfaf8]">
        </div>

        <button type="submit" class="w-full py-3 rounded-2xl bg-[#3d312a] text-white text-sm font-bold shadow-md">
            Simpan Perubahan
        </button>
    </form>
</div>
{% endblock %}
