{% extends "base.html" %}
{% block content %}
<div class="p-5">
    <!-- Header Back Button -->
    <div class="flex items-center mb-6">
        <a href="{{ url_for('index') }}" class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600 shadow-sm mr-4">
            <i class="fa-solid fa-chevron-left text-sm"></i>
        </a>
        <h1 class="text-base font-bold text-[#3d312a]">Tambah Transaksi</h1>
    </div>

    <!-- Form Tambah Transaksi -->
    <form action="{{ url_for('tambah') }}" method="POST">
        
        <!-- Toggle Jenis Transaksi (Pengeluaran / Pemasukan) -->
        <div class="bg-gray-200 p-1.5 rounded-2xl flex mb-6">
            <button type="button" id="btn-keluar" onclick="setJenis('pengeluaran')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-[#3d312a] text-white shadow-sm flex items-center justify-center space-x-2">
                <i class="fa-solid fa-minus bg-white/20 p-1 rounded-full text-[10px]"></i>
                <span>Pengeluaran</span>
            </button>
            <button type="button" id="btn-masuk" onclick="setJenis('pemasukan')" class="flex-1 py-3 rounded-xl font-bold text-xs transition-all text-gray-500 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus bg-gray-300 p-1 rounded-full text-[10px]"></i>
                <span>Pemasukan</span>
            </button>
        </div>
        <input type="hidden" name="jenis" id="input-jenis" value="pengeluaran">

        <!-- Input Jumlah Uang -->
        <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm mb-6">
            <label class="block text-xs text-gray-400 font-medium mb-1">Jumlah Uang</label>
            <div class="flex items-center">
                <span class="text-2xl font-extrabold text-[#3d312a] mr-2">Rp</span>
                <input type="number" name="jumlah" required placeholder="0" class="w-full text-3xl font-extrabold text-[#3d312a] focus:outline-none placeholder:text-gray-300">
            </div>
        </div>

        <!-- Pilihan Kategori -->
        <div class="mb-6">
            <label class="block text-xs font-bold text-[#3d312a] mb-3">Kategori</label>
            <div class="grid grid-cols-4 gap-3">
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Makanan" required class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-utensils text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Makanan</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Transportasi" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-car text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Transport</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Belanja" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-bag-shopping text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Belanja</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Pendidikan" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-graduation-cap text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Sekolah</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Hiburan" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-gamepad text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Hiburan</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Kesehatan" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-heart-pulse text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Sehat</span>
                    </div>
                </label>
                <label class="cursor-pointer flex flex-col items-center">
                    <input type="radio" name="kategori" value="Lainnya" class="peer hidden">
                    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 peer-checked:border-[#3d312a] peer-checked:bg-[#3d312a]/5 flex flex-col items-center justify-center text-gray-600 peer-checked:text-[#3d312a] shadow-sm transition-all">
                        <i class="fa-solid fa-ellipsis text-lg mb-1"></i>
                        <span class="text-[10px] font-semibold">Lainnya</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Catatan -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-4">
            <label class="block text-xs text-gray-400 font-medium mb-1">Catatan (opsional)</label>
            <input type="text" name="catatan" placeholder="Contoh: Makan siang di warung..." class="w-full text-xs font-semibold text-[#3d312a] focus:outline-none placeholder:text-gray-300">
        </div>

        <!-- Tanggal -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-6">
            <label class="block text-xs text-gray-400 font-medium mb-1">Tanggal</label>
            <input type="date" name="tanggal" value="{{ hari_ini }}" class="w-full text-xs font-semibold text-[#3d312a] focus:outline-none">
        </div>

        <!-- Tombol Simpan -->
        <button type="submit" class="w-full bg-[#3d312a] text-white py-4 rounded-2xl font-bold text-sm shadow-lg hover:bg-black transition-colors">
            Simpan Transaksi
        </button>
    </form>
</div>

<script>
    function setJenis( jenis ) {
        document.getElementById('input-jenis').value = jenis;
        const btnKeluar = document.getElementById('btn-keluar');
        const btnMasuk = document.getElementById('btn-masuk');
        
        if (jenis === 'pengeluaran') {
            btnKeluar.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-[#3d312a] text-white shadow-sm flex items-center justify-center space-x-2";
            btnMasuk.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all text-gray-500 flex items-center justify-center space-x-2";
        } else {
            btnMasuk.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all bg-[#3d312a] text-white shadow-sm flex items-center justify-center space-x-2";
            btnKeluar.className = "flex-1 py-3 rounded-xl font-bold text-xs transition-all text-gray-500 flex items-center justify-center space-x-2";
        }
    }
</script>
{% endblock %}
