<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar - Finance Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #faf7f4 0%, #f1ebe4 100%);
            padding: 18px;
            color: #3d312a;
        }
        .card {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 24px;
            padding: 26px;
            border: 1px solid #e7ddd3;
            box-shadow: 0 14px 32px rgba(61, 49, 42, 0.08);
        }
        .badge {
            display: inline-block;
            background: #fdf6ec;
            color: #92400e;
            border: 1px solid #f3d9b1;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
            letter-spacing: 0.4px;
        }
        h2 {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 800;
            color: #3d312a;
            letter-spacing: -0.3px;
        }
        p.sub {
            margin: 0 0 20px;
            font-size: 13px;
            color: #786a60;
            line-height: 1.45;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            background: #f5efe8;
            padding: 5px;
            border-radius: 14px;
            border: 1px solid #ebe2d8;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #786a60;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #3d312a;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(61, 49, 42, 0.18);
        }
        .field { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #3d312a;
        }
        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #dfd4c8;
            background: #fcfaf8;
            border-radius: 12px;
            font-size: 14px;
            color: #3d312a;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            outline: none;
            background: #ffffff;
            border-color: #b45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.12);
        }
        input::placeholder { color: #a89b90; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: #3d312a;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 8px 18px rgba(61, 49, 42, 0.2);
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .btn-submit:hover { background: #2c221d; }
        .btn-submit:active { transform: scale(0.99); }
        .error {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Finance Tracker</h2>
        <p class="sub">Masuk atau buat akun untuk mencatat keuanganmu secara terpisah.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="tabs">
            <button type="button" class="tab-btn {% if mode != 'register' %}active{% endif %}" id="btnLogin" onclick="setMode('login')">Masuk</button>
            <button type="button" class="tab-btn {% if mode == 'register' %}active{% endif %}" id="btnRegister" onclick="setMode('register')">Daftar Akun</button>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="mode" id="modeInput" value="{{ 'register' if mode == 'register' else 'login' }}">

            <div class="field" id="namaField" style="display: {{ 'block' if mode == 'register' else 'none' }};">
                <label for="nama">Nama Panggilan</label>
                <input type="text" id="nama" name="nama" placeholder="Contoh: Budi">
            </div>

            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn-submit" id="submitText">
                {{ 'Daftar & Masuk' if mode == 'register' else 'Masuk' }}
            </button>
        </form>
    </div>

    <script>
        function setMode(mode) {
            document.getElementById('modeInput').value = mode;
            const namaField = document.getElementById('namaField');
            const namaInput = document.getElementById('nama');
            const btnLogin = document.getElementById('btnLogin');
            const btnRegister = document.getElementById('btnRegister');
            const submitText = document.getElementById('submitText');

            if (mode === 'register') {
                namaField.style.display = 'block';
                namaInput.required = true;
                btnRegister.classList.add('active');
                btnLogin.classList.remove('active');
                submitText.textContent = 'Daftar & Masuk';
            } else {
                namaField.style.display = 'none';
                namaInput.required = false;
                btnLogin.classList.add('active');
                btnRegister.classList.remove('active');
                submitText.textContent = 'Masuk';
            }
        }
    </script>
</body>
</html>
